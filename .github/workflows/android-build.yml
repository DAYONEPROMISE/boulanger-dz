name: android-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Set up Gradle 8.10.2 (no wrapper in repo)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: gradle :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Assemble release APK (unsigned)
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: boulangerdz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: boulangerdz-release-apk
          path: app/build/outputs/apk/release/*.apk
